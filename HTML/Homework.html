<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Leave Management System</title>
    <link rel="stylesheet" href="../Style/H1.css">
</head>
<body>

    <div class="login-container">
        <div class="logo-section">
            <div class="logo-icon">
                
            </div>
            <span class="logo-text">ThiDinKyut Lightining Festival Donation System</span>
        </div>

        <!-- Title Section -->
        <div class="title-section">
            <p class="subtitle">Sign In — သီတင်းကျွတ်ဆီမီးတစ်ထောင်လှူဒါန်းရန်</p>
            <h1>Sign In</h1>
            <p class="desc"></p>
        </div>

        <!-- Form -->
        <form>
            <div class="form-group">
                <label>Select Role</label>
                <div class="select-wrapper">
                    <select>
                        <option>အလှူရှင်</option>
                        <option>‌ဂေါပက</option>
                        <option>ဘဘုန်း</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" value="shwedagonpagodamanagement.mm@gmail.com">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" value=".....">
            </div>

            <div class="form-row">
                <label class="checkbox-label">
                    <input type="checkbox"> Remember me
                </label>
                <a href="#" class="forgot-link">Forgot password?</a>
            </div>

            <button type="submit" class="sign-in-btn">Sign In</button>

            <div class="back-section">
                <a href="#">Back</a>
            </div>
        </form>
    </div>

</body>
</html>
